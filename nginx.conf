events {
    worker_connections 1024;
}

http {
    # Чтобы Nginx не выдавал ошибку при длинных URL от Telegram
    server_names_hash_bucket_size 64;

    # ==================================================
    # КОРИДОР 1: Старый домен (Webhooks через Cloudflare)
    # Оставляем работу через порт 80, как и было
    # ==================================================
    server {
        listen 80;
        server_name dealflow.bond;

        location / {
            # Направляем трафик на основной контейнер бота
            proxy_pass http://nemo_vpn_bot:8080;
            
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }

    # ==================================================
    # КОРИДОР 2: Новый домен nemovpn.cfd (Mini App)
    # ==================================================
    
    # 1. Автоматический редирект с HTTP на HTTPS
    server {
        listen 80;
        server_name nemovpn.cfd;
        return 301 https://$host$request_uri;
    }

    # 2. Основной блок для защищенного соединения
    server {
        listen 443 ssl;
        server_name nemovpn.cfd;

        # Пути к твоим новым сертификатам Let's Encrypt
        ssl_certificate /etc/letsencrypt/live/nemovpn.cfd/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/nemovpn.cfd/privkey.pem;

        # Оптимизация SSL
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;

        location / {
            proxy_pass http://nemo_vpn_bot:8080;
            
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Тайм-ауты для стабильной работы приложения
            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }
    }
}