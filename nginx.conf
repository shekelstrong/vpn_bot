events {
    worker_connections 1024;
}

http {
    server {
        # Слушаем внутренний порт 80 (который проброшен на 8082 хоста)
        listen 80;
        
        # Мы убрали server_name, потому что фильтровать домены 
        # (dealflow.bond и nemovpn.cfd) теперь будет главный системный Nginx.
        # Этот конфиг просто пропускает всё в бота.

        location / {
            proxy_pass http://nemo_vpn_bot:8080;
            
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }
    }
}