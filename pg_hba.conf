# TYPE  DATABASE        USER                    ADDRESS                 METHOD
# ============================================================
# PostgreSQL Hardened — 2026-05-08
# Attack vector closed: no trust auth for postgres over network
# ============================================================

# Local socket — trust for local admin (docker exec), md5 for app
local   all             postgres                                        trust
local   vpn_bot         vpn_bot_user                                    md5

# Docker network — ONLY vpn_bot_user to vpn_bot database, WITH password
host    vpn_bot         vpn_bot_user           172.18.0.0/16           scram-sha-256
host    vpn_bot         vpn_bot_user           172.22.0.0/16           scram-sha-256

# Localhost (SSH tunnel from s2 + healthcheck)
host    vpn_bot         vpn_bot_user           127.0.0.1/32            scram-sha-256
host    vpn_bot         vpn_bot_user           ::1/128                  scram-sha-256

# postgres SUPERUSER — local socket ONLY. No network access.
# (peer doesn't work in docker exec, trust is ok for local socket only)

# REJECT everything else
host    all             all                     0.0.0.0/0               reject
host    all             all                     ::/0                    reject
