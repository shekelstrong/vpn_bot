services:
  nemo_vpn_bot:
    build: .
    container_name: nemo_vpn_bot
    restart: always
    env_file:
      - .env
    volumes:
      - .:/app
    depends_on:
      - nemo_vpn_db
      - nemo_vpn_redis

  nemo_vpn_webhooks:
    build: .
    command: python webhooks.py
    container_name: nemo_vpn_webhooks
    restart: always
    env_file:
      - .env
    volumes:
      - .:/app
    # Порт 8080 виден только внутри сети Docker для Nginx
    expose:
      - "8080"
    depends_on:
      - nemo_vpn_db

  nemo_vpn_db:
    image: postgres:15-alpine
    container_name: nemo_vpn_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: vpn_bot
    volumes:
      - pgdata:/var/lib/postgresql/data
    # ПОРТЫ УДАЛЕНЫ: База теперь защищена от внешнего мира

  nemo_vpn_redis:
    image: redis:7-alpine
    container_name: nemo_vpn_redis
    restart: always
    volumes:
      - redisdata:/data

  nemo_vpn_nginx:
    image: nginx:alpine
    container_name: nemo_vpn_nginx
    restart: always
    ports:
      - "8082:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - nemo_vpn_webhooks

volumes:
  pgdata:
  redisdata: