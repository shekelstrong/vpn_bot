version: '3.8'

services:
  # Telegram Bot
  bot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nemo_vpn_bot
    restart: unless-stopped
    environment:
      - BOT_TOKEN=${BOT_TOKEN}
      - ADMIN_IDS=${ADMIN_IDS}
      - MARZBAN_URL=${MARZBAN_URL}
      - MARZBAN_ADMIN_USERNAME=${MARZBAN_ADMIN_USERNAME}
      - MARZBAN_ADMIN_PASSWORD=${MARZBAN_ADMIN_PASSWORD}
      - DATABASE_URL=postgresql+asyncpg://postgres:${POSTGRES_PASSWORD}@db:5432/vpn_bot
      - CRYPTO_BOT_TOKEN=${CRYPTO_BOT_TOKEN}
      - PLATEGA_SECRET_KEY=${PLATEGA_SECRET_KEY}
      - REFERRAL_PERCENTAGES=${REFERRAL_PERCENTAGES}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - vpn_bot_network
    volumes:
      - ./logs:/app/logs
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # PostgreSQL Database
  db:
    image: postgres:15-alpine
    container_name: nemo_vpn_db
    restart: unless-stopped
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-nemo_vpn_secure_password_123}
      - POSTGRES_DB=vpn_bot
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - vpn_bot_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d vpn_bot"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Redis (опционально, для кэширования и FSM)
  redis:
    image: redis:7-alpine
    container_name: nemo_vpn_redis
    restart: unless-stopped
    networks:
      - vpn_bot_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

networks:
  vpn_bot_network:
    driver: bridge

volumes:
  postgres_data:
