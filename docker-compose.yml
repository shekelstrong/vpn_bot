version: '3.8'

services:
  # Основной бот
  bot:
    build: .
    container_name: nemo_vpn_bot
    command: python bot.py
    restart: always
    env_file:
      - .env
    volumes:
      - .:/app
      - ./logs:/app/logs
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  # Сервер вебхуков для приема оплат
  webhooks:
    build: .
    container_name: nemo_vpn_webhooks
    command: python webhooks.py
    restart: always
    ports:
      - "8080:8080"
    env_file:
      - .env
    volumes:
      - .:/app
      - ./logs:/app/logs
    depends_on:
      db:
        condition: service_healthy

  # База данных PostgreSQL
  db:
    image: postgres:15-alpine
    container_name: nemo_vpn_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: vpn_bot
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Redis для состояний (FSM)
  redis:
    image: redis:7-alpine
    container_name: nemo_vpn_redis
    restart: always
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data: