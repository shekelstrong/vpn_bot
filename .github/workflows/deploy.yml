name: Deploy TG VPN Bot

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to Server
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: root
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            cd /root/projects/vpn_bot
            git pull origin main
            docker compose build --no-cache nemo_vpn_bot nemo_vpn_webhooks
            docker compose up -d nemo_vpn_bot nemo_vpn_webhooks
            sleep 5
            docker ps --format '{{.Names}} {{.Status}}' | grep nemo_vpn
